views.style.views_vvjb:
  type: views_style
  label: 'Views Vanilla JavaScript Basic Carousel'
  mapping:
    unique_id:
      type: integer
      label: 'Unique identifier for carousel instance'
    orientation:
      type: string
      label: 'Carousel orientation'
    items_small:
      type: integer
      label: 'Items per screen on small devices'
    items_big:
      type: integer
      label: 'Items per screen on large devices'
    gap:
      type: integer
      label: 'Gap between items in pixels'
    item_width:
      type: integer
      label: 'Custom item max width in pixels'
    looping:
      type: boolean
      label: 'Enable looping'
    slide_time:
      type: integer
      label: 'Autoplay interval in milliseconds'
    navigation:
      type: string
      label: 'Navigation type'
    breakpoints:
      type: string
      label: 'Responsive breakpoint'
    show_play_pause:
      type: boolean
      label: 'Show play/pause button'
    show_progress_bar:
      type: boolean
      label: 'Show progress bar'
    show_page_counter:
      type: boolean
      label: 'Show page counter'
    enable_keyboard_nav:
      type: boolean
      label: 'Enable keyboard navigation'
    enable_touch_swipe:
      type: boolean
      label: 'Enable touch/swipe gestures'
    enable_pause_on_hover:
      type: boolean
      label: 'Pause on hover'
    pause_on_reduced_motion:
      type: boolean
      label: 'Pause on reduced motion preference'
    enable_deeplink:
      type: boolean
      label: 'Enable deep linking'
    deeplink_identifier:
      type: string
      label: 'Deep link URL identifier'
      constraints:
        Regex:
          pattern: '/^[a-z][a-z0-9-]*[a-z0-9]$/'
          message: 'Must start with letter, contain only lowercase letters, numbers, and hyphens'
        Length:
          max: 20
    scrollable_dots_width:
      type: integer
      label: 'Scrollable dots navigation width in pixels'
      constraints:
        Range:
          min: 0
          max: 700
